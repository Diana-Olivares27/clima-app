<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App del Clima - API</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <img src="img/banner-clima.jpg" alt="Banner App del Clima" class="banner">
    <h1>⛅ App del Clima</h1>
    <p>Consulta el clima en tiempo real de cualquier ciudad</p>
  </header>

  <main>
    <form id="formulario" class="buscador">
      <input type="text" id="inputCiudad" placeholder="Escribe una ciudad... Ej. Toluca" required>
      <button type="submit">🔍 Consultar</button>
    </form>

    <div id="resultado" class="resultado"></div>
    <p id="estado"></p>
  </main>

  <footer>
    <p>&copy; 2026 - App del Clima | Datos de OpenWeatherMap</p>
    <p>Banner diseñado en Canva</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
